# NEXORA IoT backend. Secrets live in be/application-local.yml (gitignored, auto-imported when
# running from be/) or in the env vars below. Hibernate creates/updates the tables itself.
server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexora?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:YOUR_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update        # tables generated from the @Entity classes
  jackson:
    property-naming-strategy: SNAKE_CASE   # JSON keys match fe/src/types/iot.ts
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss       # from/to query params

mqtt:
  host: ${MQTT_HOST:172.20.10.2}     # laptop Wi-Fi IP (DHCP — check ipconfig)
  port: ${MQTT_PORT:2005}
  username: ${MQTT_USERNAME:TranKhacLong}
  password: ${MQTT_PASSWORD:YOUR_MQTT_PASSWORD}

jwt:
  secret: ${JWT_SECRET:YOUR_JWT_SECRET_AT_LEAST_32_CHARACTERS}

cors:
  origin: ${CORS_ORIGIN:http://localhost:5173}
