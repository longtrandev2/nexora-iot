# NEXORA IoT backend. Values come from be/.env (copy be/.env.example) or real environment variables.
# Hibernate creates the database tables itself.
spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update        # tables generated from the @Entity classes
  jackson:
    property-naming-strategy: SNAKE_CASE   # JSON keys match fe/src/types/iot.ts
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss       # from/to query params

server:
  port: ${SERVER_PORT:8080}

mqtt:
  host: ${MQTT_HOST:localhost}
  port: ${MQTT_PORT:2005}
  username: ${MQTT_USERNAME}
  password: ${MQTT_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

cors:
  origin: ${CORS_ORIGIN:http://localhost:5173}
